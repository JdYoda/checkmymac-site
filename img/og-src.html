<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
/* Исходник картинки для соцсетей. Снимается Playwright'ом в 1200×630 →  img/og.png
   Шрифты локальные (те же, что на сайте) — интернет при съёмке не нужен. */

@font-face { font-family: "Montserrat"; font-style: normal; font-weight: 400 700;
  src: url(../assets/fonts/montserrat-latin.woff2) format("woff2"); font-display: block;
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Montserrat"; font-style: normal; font-weight: 400 700;
  src: url(../assets/fonts/montserrat-latin-ext.woff2) format("woff2"); font-display: block;
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 400 600;
  src: url(../assets/fonts/jetbrains-mono-latin.woff2) format("woff2"); font-display: block; }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  background: #211f1c;
  color: #ece7dc;
  font-family: "Montserrat", sans-serif;
  position: relative;
}

/* кадр героя справа, уходит за край и растворяется в фоне */
.mac {
  position: absolute; right: 8px; top: 56%; transform: translateY(-50%);
  width: 1010px; height: 553px;
  background: url(og-mac.png) center / contain no-repeat;
}
.mac::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, #211f1c 0%, rgba(33,31,28,.9) 12%, rgba(33,31,28,.35) 34%, transparent 52%);
}

.copy { position: absolute; left: 72px; top: 62px; width: 560px; z-index: 2; }

.brand { display: flex; align-items: center; gap: 13px; font-size: 38px; font-weight: 700; letter-spacing: -.01em; }
.brand img { width: 40px; height: 40px; border-radius: 9px; display: block; }

h1 { margin-top: 62px; font-size: 78px; font-weight: 700; line-height: 1.02; letter-spacing: -.02em; }
h1 span { color: #ffca3f; }

.stat { margin-top: 26px; font-size: 25px; font-weight: 500; color: #b8ae9c; line-height: 1.35; }
.stat b { font-size: 52px; font-weight: 700; color: #e8a512; vertical-align: -6px; margin-right: 12px; }

.foot {
  position: absolute; left: 72px; bottom: 54px; z-index: 2;
  font-family: "JetBrains Mono", monospace; font-size: 15px; font-weight: 600;
  letter-spacing: .11em; color: #8a7f6a; text-transform: uppercase;
}
</style>
</head>
<body>
  <div class="mac"></div>
  <div class="copy">
    <div class="brand"><img src="appicon.png" alt="">CheckMyMac</div>
    <h1><span>Confidence</span><br>in every part.</h1>
    <p class="stat"><b>30+</b>hardware checks — one PDF verdict.</p>
  </div>
  <div class="foot">Notarized by Apple · Runs offline · Free version included</div>
</body>
</html>
